name: Rollback

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version à redéployer (format vX.Y.Z, ex: v1.0.0)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: cd-rollback
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  rollback:
    name: rollback
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Validate version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version invalide: $VERSION (format attendu vX.Y.Z)"
            exit 1
          fi

      - name: Check deployment secrets
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          PROD_DIR: ${{ secrets.PROD_DIR }}
        run: |
          missing=0
          for name in PROD_HOST PROD_USER PROD_SSH_KEY PROD_DIR; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Le secret $name n'est pas configuré."
              missing=1
            fi
          done
          exit $missing

      - name: Configure SSH
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          PROD_KNOWN_HOSTS: ${{ secrets.PROD_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$PROD_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          if [ -n "${PROD_KNOWN_HOSTS:-}" ]; then
            printf '%s\n' "$PROD_KNOWN_HOSTS" >> ~/.ssh/known_hosts
          else
            ssh-keyscan -H "$PROD_HOST" >> ~/.ssh/known_hosts
          fi

      - name: Upload deployment files
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
          PROD_DIR: ${{ secrets.PROD_DIR }}
        run: |
          scp deploy/docker-compose.prod.yml scripts/deploy.sh "$PROD_USER@$PROD_HOST:$PROD_DIR/"

      - name: Login to GHCR on server
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | ssh "$PROD_USER@$PROD_HOST" \
            "docker login ghcr.io -u '${{ github.actor }}' --password-stdin"

      - name: Rollback
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
          PROD_DIR: ${{ secrets.PROD_DIR }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ inputs.version }}
          APP_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2029
          ssh "$PROD_USER@$PROD_HOST" \
            "cd '$PROD_DIR' && chmod +x deploy.sh && API_IMAGE='$IMAGE' APP_VERSION='$APP_VERSION' RUN_MIGRATIONS='false' ./deploy.sh"
